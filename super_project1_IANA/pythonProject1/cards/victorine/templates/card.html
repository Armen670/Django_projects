<html>
<head>
    <style>
        #left {
            float: left;
            width: 65%;
            overflow: hidden;
        }
        #main {
            background: #eee;
            border: 1px solid black;
            text-align: center;
            margin: 10px 0px;
        }
        #main p {
            display: none;
        }
        .show {
            display: block !important;
        }
        .hide {
            display: none !important;
        }
        #back {
            display: none;
            margin-left: 311px;
        }
        .btn-container {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

 <div id="carouselExampleControls" class="carousel slide w-75 m-auto" data-bs-ride="carousel">
    <div class="carousel-inner">
        {% for question in questions %}
        <div class="carousel-item m-auto {% if forloop.counter == 1 %} active {% endif %}">
            <div class="front center m-auto">
                <div class="m-auto" id="wrapper">
                    <div class="m-auto" id="left"><p>{{ question.text }}</p></div>
                    <div class="m-auto" id="main">
                        <p>{{ question.answers.all.0 }}</p>
                    </div>
                </div>
                <div class="btn-container m-auto">
                    <button class="btn btn-primary" onclick="showText(this)">Показать</button>
                    <button class="btn btn-secondary hide" onclick="hideText(this)">Скрыть</button>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
    <button style="background-color:DodgerBlue;" class="carousel-control-prev" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="prev">
        <span class="carousel-control-prev-icon" aria-hidden="true"></span>
        <span class="visually-hidden"> < </span>
    </button>
    <button style="background-color:DodgerBlue;" class="carousel-control-next" type="button" data-bs-target="#carouselExampleControls" data-bs-slide="next">
        <span class="carousel-control-next-icon" aria-hidden="true"></span>
        <span class="visually-hidden"> > </span>
    </button>
 </div>

 <script>
    function showText(button) {
        var mainDiv = button.parentElement.parentElement.querySelector('#main');
        var hiddenText = mainDiv.querySelector('p');
        hiddenText.classList.add('show');
        button.classList.add('hide');
        button.nextElementSibling.classList.remove('hide');
    }

    function hideText(button) {
        var mainDiv = button.parentElement.parentElement.querySelector('#main');
        var hiddenText = mainDiv.querySelector('p');
        hiddenText.classList.remove('show');
        button.classList.add('hide');
        button.previousElementSibling.classList.remove('hide');
    }
 </script>
</body>
</html>
