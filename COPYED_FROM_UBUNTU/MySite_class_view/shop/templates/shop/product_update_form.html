{% extends 'shop/base.html'%}
<meta charset="UTF-8">
<title>
    Update Product
</title>
{% block body %}
<h1>Create a new product</h1>
<div>
    <form method="post" enctype="multipart/form-data" >
        {% csrf_token %}
        {{form.as_p}}
        <button type="submit" >Update</button>
    </form>
</div>
<div>
    <a href="{% url 'shop:product_details' pk=object.pk %}">
        Back to product #{{ object.pk }}
    </a>
</div>
{% endblock %}
