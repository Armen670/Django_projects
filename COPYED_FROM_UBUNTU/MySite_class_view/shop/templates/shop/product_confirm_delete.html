{% extends 'shop/base.html' %}

{% block title %}
    Confirm archive {{ object.name }}
{% endblock %}

{% block body %}
<h1>
    Are you sure about archive {{ object.name }} ???
</h1>
<div>
    <a href="{% url 'shop:product_details' pk=object.pk %}">
        Back to Product
    </a>
</div>
<br>
<div>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Archive</button>
    </form>
</div>
{% endblock %}
