<!-- templates/cart_detail.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body>
    <div class="container">
        <h1>Cart</h1>
        <div class="row">
            {% for item in cart_items %}
            <div class="col-md-12">
                <div class="card mb-3">
                    <div class="card-body">
                        <h5 class="card-title">{{ item.product.name }}</h5>
                        <p class="card-text">Quantity:
                            <form method="post" action="{% url 'update_cart_item' item.id %}">
                                {% csrf_token %}
                                <input type="number" name="quantity" value="{{ item.quantity }}" min="1" max="99" style="width: 60px;">
                                <button type="submit" class="btn btn-primary">Update</button>
                            </form>
                        </p>
                        <p class="card-text">Price per unit: ${{ item.product.price }}</p>
                        <p class="card-text">Total: ${{ item.total_price }}</p>
                        <a href="{% url 'remove_from_cart' item.id %}" class="btn btn-danger">Remove One</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
        <a href="{% url 'clear_cart' %}" class="btn btn-danger">Clear Cart</a>
    </div>
</body>
</html>
