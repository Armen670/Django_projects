{% extends 'main/base.html' %}
{% block content %}

    <div class="features">
        <h1 class="list-group-item active text-center text-white">News</h1>

            {% for news in news %}
                <div class="alert alert-warning">
                    <h3>{{ news.title }}</h3>
                    <p>{{ news.author.username }} [{{ news.created_date }}]</p>

                    <a href="{% url 'news_detail' news.id %}" class="btn btn-warning">Читать детальее</a>
                </div>
            {% endfor %}


        {% if user.is_authenticated %}
        <a href="{% url 'add_news' %}">Add News</a>
        {% endif %}
    </div>
{% endblock %}
